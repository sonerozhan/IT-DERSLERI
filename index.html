<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Uzmanlık Akademisi | Personel Gelişim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8">
        
        <!-- Üst Bilgi & Profil Alanı -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 mb-6 gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                    <h1 class="text-xl font-bold text-emerald-400">⚡ IT Uzmanlık Akademisi</h1>
                </div>
                <p class="text-xs text-slate-400 mt-1">Operasyon Personeli: <span class="text-cyan-300 font-semibold">Soner Özhan</span></p>
            </div>

            <!-- Sağ Üst: Günün Akli / IT Tavsiyesi -->
            <div class="bg-slate-900/80 border border-amber-500/30 px-3 py-2 rounded-xl max-w-xs">
                <span class="text-[10px] font-bold text-amber-400 block tracking-wider">💡 GÜNÜN KOÇLUK TAVSİYESİ</span>
                <p id="daily-advice" class="text-xs text-slate-300 mt-0.5">Yükleniyor...</p>
            </div>

            <!-- Puan & Seviye -->
            <div class="flex gap-3">
                <div class="bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 text-center">
                    <span class="block text-[10px] text-slate-400">PUAN</span>
                    <span id="score" class="text-base font-extrabold text-amber-400">0</span>
                </div>
                <div class="bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 text-center">
                    <span class="block text-[10px] text-slate-400">RÜTBE / SEVİYE</span>
                    <span id="level" class="text-base font-extrabold text-cyan-400">1</span>
                </div>
            </div>
        </div>

        <!-- Soru Alanı -->
        <div id="quiz-container">
            <div class="mb-4 flex justify-between items-center">
                <span id="category-badge" class="bg-blue-900/60 text-blue-300 text-xs px-3 py-1 rounded-full border border-blue-700">Kategori</span>
                <span id="question-count" class="text-xs text-slate-400">Soru 1/10</span>
            </div>
            
            <h2 id="question-text" class="text-base md:text-lg font-semibold mb-6 text-slate-100 leading-relaxed">Soru yükleniyor...</h2>

            <div id="options-container" class="space-y-3 mb-6">
                <!-- Şıklar buraya dinamik gelecek -->
            </div>

            <div id="feedback" class="hidden p-4 rounded-xl mb-4 text-sm font-medium"></div>

            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30">
                Sonraki Zorlu Senaryo 🚀
            </button>
        </div>
    </div>

    <script>
        // Günün akıl veren sözleri / tecrübe notları
        const advices = [
            "Asla yedeksiz (backup) sistem değişikliği yapma, veriyi kaybetmektense 10 dakika fazla bekletmek iyidir.",
            "Fortigate loglarında 'Deny' görüyorsan önce kural sırasına (Policy ID) bak, kurallar yukarıdan aşağıya okunur!",
            "Kullanıcı 'internetim yok' diyorsa ilk önce ping at, sonra DNS çözümlüyor mu diye test et.",
            "Active Directory'de şifre değişmiyorsa Replica durumunu ve SYSVOL klasörünü kontrol etmeyi unutma.",
            "Switch üzerinde port flapping (gidip gelme) varsa, kabloyu veya fiziksel portu hızlıca değiştir."
        ];

        // Genişletilmiş ve Zorlaştırılmış IT Soru Bankası
        const questions = [
            {
                category: "Firewall & Güvenlik (İleri)",
                question: "Şirket dışındaki bir şube, merkez sunucuya IPsec VPN üzerinden bağlı ancak içerideki dosya paylaşım sunucusuna (SMB) erişemiyor. Ping atılabiliyor ama port (445) yanıt vermiyor. İlk şüphelenmen gereken ve kontrol etmen yer neresidir?",
                options: [
                    "Merkezdeki Fortigate üzerindeki Firewall Policy kurallarında IPsec interface'den LAN'a gelen SMB (TCP 445) trafiğinin engellenip engellenmediği",
                    "Şubedeki kullanıcının klavye dilinin İngilizce olması",
                    "Merkez sunucunun ekran çözünürlüğü",
                    "Switch cihazının elektrik kablosunun takılı olup olmadığı"
                ],
                correct: 0,
                explanation: "Mükemmel! Ping (ICMP) ayrı bir protokoldür ve geçebilir; ancak güvenlik duvarı politikalarında özel servis portları (SMB 445 gibi) açık tanımlanmadıysa trafik drop edilir."
            },
            {
                category: "Active Directory & DNS",
                question: "Bir kullanıcı bilgisayarını açtığında 'Güvenlik ilişki hatası (Trust relationship failed)' uyarısı alıyor ve domaine giriş yapamıyor. Bu sorunu çözmek için en pratik ve kalıcı yöntem nedir?",
                options: [
                    "Bilgisayara format atmak",
                    "Local Administrator ile açıp, Active Directory'den bilgisayar hesabını resetleyip (`Reset Computer Account`), makinayı Workgroup'a alıp tekrar domaine dahil etmek",
                    "Modemi resetlemek",
                    "Ethernet kablosunu değiştirmek"
                ],
                correct: 1,
                explanation: "Doğru! Trust relationship kopması, makina şifresinin DC ile uyuşmamasından kaynaklanır. Hesabı resetleyip yeniden joinlemek en temiz çözümdür."
            },
            {
                category: "Network & Switch Yönetimi",
                question: "Ofisteki bir switch üzerinde bazı portlarda sürekli kopmalar ve ağda yavaşlama var. Switch loglarında 'Port loop detected' uyarısı görüyorsun. Bu durumun en yaygın sebebi nedir?",
                options: [
                    "Switch'in tozlanmış olması",
                    "Bir kullanıcının Ethernet kablosunun iki ucunu da aynı switch'e takarak döngü (loop) yaratması",
                    "İnternet sağlayıcısının hız düşürmesi",
                    "Aktif dizin şifresinin süresinin dolması"
                ],
                    correct: 1,
                explanation: "Harika! Loop (döngü), kablonun iki ucunun aynı cihaza bağlanmasıyla broadcast fırtınasına yol açar. STP (Spanning Tree Protocol) kapalıysa ağı kilitler."
            },
            {
                category: "Sunucu & Donanım Arızası",
                question: "Şirketin ana File Server sunucusunda RAID 5 yapısı kullanılıyor. Sunucuyu açtığında bir diskin 'Failed' durumunda olduğunu ve sistemin 'Degraded' çalıştığını gördün. Ne yapmalısın?",
                options: [
                    "Sunucuyu tamamen kapatıp beklemek",
                    "Bozulan diski hot-swap özellik sayesinde söküp yerine aynı model sağlam bir disk takarak RAID Rebuild (yeniden oluşturma) sürecini başlatmak",
                    "Tüm diskleri söküp sıfırdan kurulum yapmak",
                    "Ethernet kablosunu söküp takmak"
                ],
                correct: 1,
                explanation: "Tebrikler! RAID 5 tek disk toleransına sahiptir. Bozulan disk hot-swap ile değiştirilerek veri kaybı önlenir ve rebuild tetiklenir."
            },
            {
                category: "DHCP & IP Yönetimi",
                question: "Ağda yeni kurulan yazıcıya statik IP vermek istiyorsun ancak bu IP adresinin halihazırda başka bir cihaza DHCP tarafından verilmiş olabileceğinden şüpheleniyorsun. Çakışmayı önlemek için DHCP havuzunda yapman gereken ilk işlem nedir?",
                options: [
                    "Hiçbir şey yapmadan rastgele bir IP vermek",
                    "DHCP yöneticisinden ilgili IP adresini 'Exclusions' (Hariç Tutulanlar) listesine eklemek veya rezerve etmek",
                    "Switch'i fabrika ayarlarına döndürmek",
                    "Active Directory servisini yeniden başlatmak"
                ],
                correct: 1,
                explanation: "Doğru! Statik cihazlara verilen IP'lerin DHCP Scope aralığında çakışmaması için Exclusion (hariç tutma) tanımlanmalıdır."
            }
        ];

        let currentQuestion = 0;
        let score = parseInt(localStorage.getItem("it_score")) || 0;
        let level = parseInt(localStorage.getItem("it_level")) || 1;

        // Sayfa açıldığında rastgele tavsiye yükle
        document.getElementById("daily-advice").innerText = advices[Math.floor(Math.random() * advices.length)];
        
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score");
        const levelDisplay = document.getElementById("level");
        const categoryBadge = document.getElementById("category-badge");
        const questionCount = document.getElementById("question-count");
        const feedback = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");

        scoreDisplay.innerText = score;
        levelDisplay.innerText = level;

        function loadQuestion() {
            feedback.classList.add("hidden");
            nextBtn.classList.add("hidden");
            
            const q = questions[currentQuestion];
            categoryBadge.innerText = q.category;
            questionCount.innerText = `Senaryo ${currentQuestion + 1}/${questions.length}`;
            questionText.innerText = q.question;
            
            optionsContainer.innerHTML = "";
            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 bg-slate-900 border border-slate-700 hover:border-slate-500 rounded-xl transition duration-200 text-sm font-medium text-slate-200";
                btn.innerText = option;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex) {
            const q = questions[currentQuestion];
            const buttons = optionsContainer.getElementsByTagName("button");
            
            for(let btn of buttons) {
                btn.disabled = true;
            }

            if(selectedIndex === q.correct) {
                buttons[selectedIndex].classList.add("bg-emerald-950", "border-emerald-500", "text-emerald-200");
                score += 25;
                feedback.className = "p-4 rounded-xl mb-4 text-sm font-medium bg-emerald-950/80 border border-emerald-800 text-emerald-300";
                feedback.innerText = "🎉 Doğru Hamle, Kanka! Teknik Açıklama: " + q.explanation;
            } else {
                buttons[selectedIndex].classList.add("bg-rose-950", "border-rose-500", "text-rose-200");
                buttons[q.correct].classList.add("bg-emerald-950", "border-emerald-500", "text-emerald-200");
                feedback.className = "p-4 rounded-xl mb-4 text-sm font-medium bg-rose-950/80 border border-rose-800 text-rose-300";
                feedback.innerText = "❌ Yanlış Hamle! Doğrusu Şöyle Olmalıydı: " + q.explanation;
            }

            // Seviye hesaplama
            if(score >= 50) level = 2;
            if(score >= 100) level = 3;
            if(score >= 150) level = 4; // Kıdemli SysAdmin

            scoreDisplay.innerText = score;
            levelDisplay.innerText = level;

            // Hafızaya kaydet
            localStorage.setItem("it_score", score);
            localStorage.setItem("it_level", level);

            feedback.classList.remove("hidden");
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestion++;
            if(currentQuestion < questions.length) {
                loadQuestion();
            } else {
                document.getElementById("quiz-container").innerHTML = `
                    <div class="text-center py-8">
                        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Tebrikler Soner Özhan! 🏆</h2>
                        <p class="text-slate-300 mb-4">Tüm kritik IT senaryolarını başarıyla tamamladın.</p>
                        <p class="text-lg font-semibold text-amber-400 mb-6">Toplam Uzmanlık Puanın: ${score}</p>
                        <button onclick="localStorage.clear(); location.reload();" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-xl transition duration-200 shadow-lg">
                            Simülasyonu Sıfırla ve Başa Dön 🔄
                        </button>
                    </div>
                `;
            }
        }

        loadQuestion();
    </script>
</body>
</html>
